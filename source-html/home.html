<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F7DE8B,#DDAF4B 60%,#D9B45B);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#181203;box-shadow:0 0 0 3px rgba(221,175,75,.18);flex:none}
.pcard{margin:8px 20px 0;padding:18px;border-radius:26px;background:linear-gradient(150deg,#161E38,#131A30 60%);border:1px solid var(--line);display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;top:-40px;inset-inline-start:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(221,175,75,.14),transparent 70%)}
.ringwrap{position:relative;width:96px;height:96px;flex:none}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:20px;font-weight:800;color:var(--gold1)}
.ringtxt span{font-size:8.5px;color:var(--t3);font-weight:700}
</style></head><body><div class="phone">
  <div class="statusbar"><span>۰۹:۴۱</span>
    <span class="sb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#F7F4EC"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#F7F4EC" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4a10 10 0 0 1 13 0"/><path d="M3.8 6.8a6.5 6.5 0 0 1 8.4 0"/><circle cx="8" cy="9.8" r="1.4" fill="#F7F4EC" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".8" y=".8" width="20" height="10.4" rx="3" stroke="#F7F4EC" stroke-opacity=".5" stroke-width="1.2"/><rect x="2.6" y="2.6" width="13" height="6.8" rx="1.6" fill="#F7F4EC"/><path d="M23 4v4c1.2-.3 1.8-1 1.8-2S24.2 4.3 23 4z" fill="#F7F4EC" opacity=".5"/></svg>
    </span></div>

  <div class="header" style="padding-top:14px">
    <div class="avatar">ح</div>
    <div class="grow"><h1 class="title" style="font-size:18px">سلام، حسین</h1><div class="sub">شنبه ۲۸ شهریور ۱۴۰۴</div></div>
    <div class="iconbtn"><span class="dot"></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 7.5 2.5 7.5h-17S4 15 4 8.5"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg></div>
  </div>

  <div class="pcard">
    <div class="ringwrap">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#1A2240" stroke-width="9"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="170.9 251.3" transform="rotate(-90 48 48)"/>
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7DE8B"/><stop offset="1" stop-color="#DDAF4B"/></linearGradient></defs>
      </svg>
      <div class="ringtxt"><b>۶۸٪</b><span>پیشرفت</span></div>
    </div>
    <div class="grow">
      <div style="font-size:15px;font-weight:800">پیشرفت امروز</div>
      <div class="sub" style="margin-top:4px">۵ از ۸ کار انجام شد</div>
      <div style="margin-top:6px"><span class="chip c-yel">۲ سررسید مهم باقی مانده</span></div>
      <button class="btn-gold small" style="margin-top:12px">مشاهده برنامه</button>
    </div>
  </div>

  <div class="sect" style="margin:20px 20px 14px"><span>خدمات یادمان</span><span class="muted" style="font-size:10.5px;font-weight:700">مدیریت +</span></div>

    <div class="item"><div class="circ" style="color:var(--info)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7.5h2M13 7.5h2M9 11.5h2M13 11.5h2M10 21v-4h4v4"/></svg><span class="badge b-red">1</span></div><span class="lbl">شارژ ساختمان</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-med)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l-7-7a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z"/><path d="M7 7l7 7"/></svg><span class="badge b-yel">5</span></div><span class="lbl">داروها</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-meet)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg><span class="badge b-red">1</span></div><span class="lbl">قرارها</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-shop)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2.5L11 13"/><path d="M21.5 2.5l-6.8 19-3.7-8.5-8.5-3.7z"/></svg><span class="badge b-grn"></span></div><span class="lbl">مسافرت</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-shop)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M3 4h2.2l2.5 11.5h10.6L21 8H7"/></svg><span class="badge b-yel">4</span></div><span class="lbl">خرید</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-note)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8.5h6M9 12.5h6M9 16.5h3.5"/></svg><span class="badge b-grn"></span></div><span class="lbl">یادداشت‌ها</span></div>
    <div class="item"><div class="circ" style="color:var(--info)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5.5c0 5-3.4 8.2-8 9.5-4.6-1.3-8-4.5-8-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg><span class="badge b-grn"></span></div><span class="lbl">بیمه‌ها</span></div>
    <div class="item"><div class="circ" style="color:var(--warning)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5l1.8-5.2a2 2 0 0 1 1.9-1.3h8.6a2 2 0 0 1 1.9 1.3l1.8 5.2"/><rect x="3" y="16.5" width="18" height="4.5" rx="1.5"/><path d="M7 21v1M17 21v1"/></svg><span class="badge b-yel">1</span></div><span class="lbl">سرویس خودرو</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-shop)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 9.5V8a2 2 0 0 1 2-2h13"/><path d="M15.5 12.5h5.5v4h-5.5a2 2 0 0 1 0-4z"/></svg><span class="badge b-grn"></span></div><span class="lbl">حقوق</span></div>
    <div class="item"><div class="circ" style="color:var(--gold1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5.5"/><path d="M14.9 7.1a5.5 5.5 0 1 1-7.8 7.8"/></svg><span class="badge b-grn"></span></div><span class="lbl">پول توجیبی</span></div>
    <div class="item"><div class="circ" style="color:var(--cat-med)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M5 21v-5.5A3.5 3.5 0 0 1 8.5 12h7a3.5 3.5 0 0 1 3.5 3.5V21"/><path d="M12 12V9.5"/><path d="M12 6.5a1.6 1.6 0 0 0 1.6-1.6C13.6 3.6 12 2.5 12 2.5s-1.6 1.1-1.6 2.4A1.6 1.6 0 0 0 12 6.5z"/></svg><span class="badge b-yel">2</span></div><span class="lbl">تولدها</span></div>

    <div class="item"><div class="circ" style="border-style:dashed;color:var(--t3)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><span class="lbl muted">افزودن</span></div>
  </div>

  <div class="nav">
    <div class="slot on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 3.5l8 7"/><path d="M6 9v11.5h12V9"/></svg></div>
    <div class="slot"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 6.5 2.5 7.5 2.5 7.5h-17S4 15 4 8.5"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg></div>
