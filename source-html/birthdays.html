<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.bcard{margin:0 20px 11px;padding:14px;border-radius:20px;position:relative;overflow:hidden}
.bcard .deco{position:absolute;left:12px;top:30px;opacity:.10}
.sw{display:flex;align-items:center;gap:9px;margin-top:11px}
.sw .lb{font-size:10px;font-weight:700;color:var(--t2);flex:1}
.empty{margin:14px 20px 0;padding:16px;border-radius:20px;border:1.5px dashed rgba(62,213,152,.4);background:rgba(62,213,152,.06);display:flex;align-items:center;gap:10px;color:var(--success);font-size:11px;font-weight:700}
</style></head><body><div class="phone">
  <div class="statusbar"><span>۰۹:۴۱</span>
    <span class="sb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#F7F4EC"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#F7F4EC" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4a10 10 0 0 1 13 0"/><path d="M3.8 6.8a6.5 6.5 0 0 1 8.4 0"/><circle cx="8" cy="9.8" r="1.4" fill="#F7F4EC" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".8" y=".8" width="20" height="10.4" rx="3" stroke="#F7F4EC" stroke-opacity=".5" stroke-width="1.2"/><rect x="2.6" y="2.6" width="13" height="6.8" rx="1.6" fill="#F7F4EC"/><path d="M23 4v4c1.2-.3 1.8-1 1.8-2S24.2 4.3 23 4z" fill="#F7F4EC" opacity=".5"/></svg>
    </span></div>

  <div class="header" style="padding-top:12px">
    <div class="grow"><h1 class="title">تولدها و سالگردها</h1></div>
  </div>
  <div class="tabs" style="margin:4px 20px 14px"><div class="tab on">تولدها (۸)</div><div class="tab">سالگردها (۴)</div></div>

  <div class="bcard card">
    <span class="deco"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FF7A9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="tile" style="background:rgba(255,122,158,.14);color:var(--cat-med);font-size:17px;font-weight:800">ف</div>
      <div class="grow"><div class="name">فاطمه (همسر)</div><div class="meta">۱۵ مهر</div></div>
      <span class="chip c-yel">۱۷ روز دیگر</span>
    </div>
    <div class="sw"><span class="lb">هشدار از ۲ روز قبل</span><span class="toggle on" style="width:40px;height:24px"><i style="width:16px;height:16px"></i></span></div>
  </div>

  <div class="bcard card" style="border-color:rgba(255,107,129,.45);box-shadow:0 0 0 3px rgba(255,107,129,.08)">
    <span class="deco"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FF6B81" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="tile" style="background:rgba(76,195,255,.14);color:var(--info);font-size:17px;font-weight:800">م</div>
      <div class="grow"><div class="name">محمد (پسر)</div><div class="meta">۲۸ شهریور</div></div>
      <span class="chip c-red">فردا 🎁</span>
    </div>
    <div class="sw"><span class="lb">هشدار از ۲ روز قبل</span><span class="toggle on" style="width:40px;height:24px"><i style="width:16px;height:16px"></i></span></div>
  </div>

  <div class="bcard card">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="tile" style="background:rgba(221,175,75,.15);color:var(--gold2);font-size:17px;font-weight:800">ا</div>
      <div class="grow"><div class="name">سالگرد ازدواج</div><div class="meta">۱۰ آبان</div></div>
      <span class="chip c-grn">۴۳ روز دیگر</span>
    </div>
  </div>

  <div class="empty">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
    تبریک! هیچ مناسبت دیگری در ۳۰ روز آینده نیست
  </div>
  <div style="margin:14px 20px 0"><button class="btn-ghost" style="width:100%;height:44px;border-style:dashed;color:var(--t2)">+ افزودن مناسبت جدید</button></div>
  <div class="home-ind"></div>
</div></body></html>
