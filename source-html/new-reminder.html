<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 20px 0}
.titem{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--t2)}
.titem.sel{border-color:var(--gold2);background:rgba(221,175,75,.10);color:var(--gold1);box-shadow:0 0 0 3px rgba(221,175,75,.12)}
.frow{display:flex;gap:9px;margin:9px 20px 0}
.frow .input{flex:1}
.trow{display:flex;align-items:center;gap:10px;margin:9px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.trow .lab{flex:1;font-size:11.5px;font-weight:700}
.flab{margin:13px 20px 6px;font-size:10.5px;font-weight:800;color:var(--t3)}
</style></head><body><div class="phone">
  <div class="statusbar"><span>۰۹:۴۱</span>
    <span class="sb-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#F7F4EC"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#F7F4EC" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4a10 10 0 0 1 13 0"/><path d="M3.8 6.8a6.5 6.5 0 0 1 8.4 0"/><circle cx="8" cy="9.8" r="1.4" fill="#F7F4EC" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".8" y=".8" width="20" height="10.4" rx="3" stroke="#F7F4EC" stroke-opacity=".5" stroke-width="1.2"/><rect x="2.6" y="2.6" width="13" height="6.8" rx="1.6" fill="#F7F4EC"/><path d="M23 4v4c1.2-.3 1.8-1 1.8-2S24.2 4.3 23 4z" fill="#F7F4EC" opacity=".5"/></svg>
    </span></div>

  <div class="header" style="padding-top:10px">
    <div class="grow"><h1 class="title">یادآوری جدید</h1></div>
    <div class="iconbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
  </div>

  <div class="tgrid">
    <div class="titem sel"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#E8B84B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="12" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/></svg>قسط</div>
    <div class="titem"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9D8CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9l4.5 4.5v14.5H6z"/><path d="M9 13l2.2 2.2L15.5 11"/></svg>چک</div>
    <div class="titem"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4CC3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg>قرار</div>
    <div class="titem"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FF7A9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l-7-7a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z"/><path d="M7 7l7 7"/></svg>دارو</div>
    <div class="titem"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3ED598" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M3 4h2.2l2.5 11.5h10.6L21 8H7"/></svg>خرید</div>
    <div class="titem"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7E8399" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>سایر</div>
  </div>

  <div class="frow"><div class="input" style="color:var(--t1)"><span class="lab">عنوان:</span>قسط بانک ملی</div></div>
  <div class="frow">
    <div class="input"><span class="lab">مبلغ کل:</span>۲۰٬۰۰۰٬۰۰۰</div>
    <div class="input"><span class="lab">هر قسط:</span>۳٬۳٬۰۰</div>
  </div>
  <div class="frow">
    <div class="input"><span class="lab">شروع:</span>۱۴۰۵/۰۱/۱۰ <svg style="margin-right:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7E8399" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div>
    <div class="input"><span class="lab">پایان:</span>۱۴۰۶/۰۱/۱۰ <svg style="margin-right:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7E8399" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div>
  </div>

  <div class="flab">بازه پرداخت</div>
  <div class="seg" style="margin:0 20px"><div class="opt">یک‌ماهه</div><div class="opt on">دوماهه</div><div class="opt">سه‌ماهه</div><div class="opt">چهارماهه</div></div>

  <div class="frow"><div class="input"><span class="lab">طرف حساب:</span>بانک <svg style="margin-right:auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7E8399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div></div>

  <div class="trow">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E8399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span class="lab">یادآوری پیامکی <span class="chip c-gold" style="font-size:8.5px;padding:1px 7px">اشتراک</span></span>
    <span class="toggle"><i></i></span>
  </div>
  <div class="trow">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9BED2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7.5l9 6 9-6"/></svg>
    <span class="lab">یادآوری ایمیلی <span class="chip c-grn" style="font-size:8.5px;padding:1px 7px">رایگان</span></span>
    <span class="toggle on"><i></i></span>
  </div>

  <div class="flab">زمان هشدار</div>
  <div class="seg" style="margin:0 20px"><div class="opt on">۲ روز قبل</div><div class="opt on">۱ روز قبل</div><div class="opt on">روز موعود</div></div>

  <div style="margin:16px 20px 0"><button class="btn-gold" style="height:50px">ذخیره یادآوری</button></div>
  <div class="home-ind"></div>
</div></body></html>
